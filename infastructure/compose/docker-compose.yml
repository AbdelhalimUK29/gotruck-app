services:

  postgres:
    image: postgres:17

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - gotruck-network


  keycloak:

    image: quay.io/keycloak/keycloak:26.3

    restart: unless-stopped

    command:
      - start-dev
      - --import-realm

    environment:

      KC_DB: postgres

      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB}

      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}

      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-localhost}

    ports:
      - "${KEYCLOAK_PORT}:8080"

    volumes:
      - ../keycloak/realm:/opt/keycloak/data/import

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - gotruck-network


  pgadmin:

    image: dpage/pgadmin4

    restart: unless-stopped

    environment:

      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}

      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}

    ports:

      - "5050:80"

    depends_on:
      postgres:
        condition: service_healthy

    networks:

      - gotruck-network


  mailpit:

    image: axllent/mailpit

    restart: unless-stopped

    ports:

      - "${MAILPIT_SMTP_PORT}:1025"

      - "${MAILPIT_HTTP_PORT}:8025"

    networks:

      - gotruck-network
  
  minio:
    image: minio/minio:latest

    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"

    volumes:
      - minio-data:/data

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - gotruck-network


  redis:
    image: redis:7

    restart: unless-stopped

    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"

    ports:
      - "${REDIS_PORT:-6379}:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - gotruck-network


  rabbitmq:
    image: rabbitmq:3-management

    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

    ports:
      - "${RABBITMQ_AMQP_PORT:-5561}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - gotruck-network


  gotruck-api:

    build:
      context: ../../backend/goTruck
      dockerfile: Dockerfile

    image: gotruck-api:latest

    restart: unless-stopped

    ports:
      - "${GOTRUCK_API_PORT:-8081}:8081"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gotruck
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_SERVER_URL}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/goTruck/protocol/openid-connect/certs
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_ADMIN_SERVER_URL}
      KEYCLOAK_ADMIN_REALM: ${KEYCLOAK_ADMIN_REALM}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      APP_STORAGE_MINIO_ENDPOINT: http://minio:9000
      APP_STORAGE_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      APP_STORAGE_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      APP_STORAGE_MINIO_TEMP_BUCKET: ${MINIO_TEMP_BUCKET:-gotruck-media-temp}
      APP_STORAGE_MINIO_PUBLIC_BUCKET: ${MINIO_PUBLIC_BUCKET:-gotruck-media-public}

    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

    networks:
      - gotruck-network


volumes:

  postgres-data:

  keycloak-data:

  minio-data:

  redis-data:

  rabbitmq-data:


networks:

  gotruck-network: